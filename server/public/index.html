<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>afl.cn · 盆栽监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            color: #1b3a1b;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; }
        header h1 { font-size: 32px; margin-bottom: 8px; }
        header .subtitle { font-size: 14px; opacity: 0.7; }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card .label { font-size: 13px; opacity: 0.6; margin-bottom: 8px; }
        .card .value { font-size: 32px; font-weight: 600; }
        .card .value.pump-on   { color: #1976d2; }
        .card .value.pump-off  { color: #757575; }
        .card .value.pump-lock { color: #d32f2f; }
        .card.sensor-err { background: #ffebee; border: 2px solid #d32f2f; }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .chart-card h2 { font-size: 18px; margin-bottom: 16px; }
        .chart-container { position: relative; height: 320px; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
        }

        .bar-container {
            margin-top: 12px;
            background: #f0f0f0;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #66bb6a, #43a047);
            transition: width 0.5s;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
            margin-top: 30px;
            padding-bottom: 20px;
        }

        .control-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .control-card h2 { font-size: 18px; margin-bottom: 12px; }
        .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn {
            padding: 12px 20px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-water { background: #1976d2; color: white; }
        .btn-stop  { background: #d32f2f; color: white; }
        .btn-cal   { background: #757575; color: white; }
        .btn-reb   { background: #f57c00; color: white; }
        .control-status {
            margin-top: 10px;
            font-size: 13px;
            color: #555;
            min-height: 18px;
        }
        .control-status.ok  { color: #2e7d32; }
        .control-status.err { color: #c62828; }

        /* 配置表单 */
        .config-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .config-card h2 { font-size: 18px; margin-bottom: 12px; }
        .config-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .config-row label {
            flex: 0 0 120px;
            color: #555;
        }
        .config-row input[type=range] {
            flex: 1;
            accent-color: #43a047;
        }
        .config-row .value {
            flex: 0 0 50px;
            font-weight: 600;
            color: #1b3a1b;
            text-align: right;
        }
        .config-row select {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 14px;
        }
        .btn-save { background: #43a047; color: white; }
        .deadzone-note {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
        }

        /* 浇水历史表格 */
        .history-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .history-card h2 { font-size: 18px; margin-bottom: 12px; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .history-table th, .history-table td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        .history-table th {
            font-weight: 600;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }
        .history-table .trigger-auto { color: #1976d2; font-weight: 600; }
        .history-table .trigger-web  { color: #43a047; font-weight: 600; }
        .history-table .running     { color: #f57c00; font-style: italic; }
        .history-empty {
            text-align: center;
            padding: 20px;
            opacity: 0.5;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            header h1 { font-size: 24px; }
            .card .value { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌱 盆栽实时监控</h1>
            <div class="subtitle">afl.cn · 每 30 秒自动刷新</div>
        </header>

        <div id="content">加载中...</div>

        <div class="control-card">
            <h2>🎮 远程控制</h2>
            <div class="btn-row">
                <button class="btn btn-water" onclick="sendCmd('WATER', {sec: 5})">💧 浇水 5 秒</button>
                <button class="btn btn-water" onclick="sendCmd('WATER', {sec: 15})">💧 浇水 15 秒</button>
                <button class="btn btn-stop"  onclick="sendCmd('STOP', null)">⛔ 立即停泵</button>
                <button class="btn btn-reb"   onclick="sendCmd('REBOOT', null)">🔄 重启 ESP32</button>
                <button class="btn btn-reb"   onclick="checkOtaUpdate()">⬆️ 检查更新</button>
            </div>
            <div id="ctrl-status" class="control-status"></div>
            <div style="font-size:11px; opacity:0.6; margin-top:8px;">
                ⏱ 命令会在 ESP32 下次上报数据时执行 (默认 5 分钟)
            </div>
        </div>

        <div class="config-card">
            <h2>⚙️ 阈值配置</h2>
            <div class="config-row">
                <label>启泵阈值:</label>
                <input type="range" id="on-slider" min="0" max="99" value="30">
                <span class="value"><span id="on-val">30</span>%</span>
            </div>
            <div class="config-row">
                <label>关泵阈值:</label>
                <input type="range" id="off-slider" min="1" max="100" value="70">
                <span class="value"><span id="off-val">70</span>%</span>
            </div>
            <div class="config-row">
                <label>推送周期:</label>
                <select id="period-select">
                    <option value="30000">30 秒 (DEBUG)</option>
                    <option value="60000">1 分钟</option>
                    <option value="300000" selected>5 分钟 (推荐)</option>
                    <option value="1800000">30 分钟</option>
                    <option value="3600000">1 小时 (省电)</option>
                </select>
            </div>
            <button class="btn btn-save" id="save-config" onclick="saveConfig()">💾 保存配置</button>
            <div id="config-status" class="control-status"></div>
            <div class="deadzone-note">
                死区 (off_pct − on_pct) 必须 ≥ 5%, 防止临界值反复跳. ⏱ ESP32 下次上报时应用新配置 (最长一个推送周期).
            </div>
        </div>

        <div class="history-card">
            <h2>💧 浇水历史 <span style="font-size:12px;font-weight:400;opacity:0.6;" id="history-count"></span></h2>
            <div id="history-content">加载中...</div>
        </div>

        <div class="footer">
            数据来源: ESP32 (每 5 分钟上报) · 前端每 30 秒刷新
        </div>
    </div>

    <script>
        const PUMP_LABEL = { ON: '运行中', OFF: '已停止', LOCKED: '已锁定' };
        const API_KEY = prompt('输入 API_KEY (一次性, 保存在浏览器)', '05579823c3b7a34d986e9ac93cde58999e05c5498b12576843a4a0db22b901c3') || '05579823c3b7a34d986e9ac93cde58999e05c5498b12576843a4a0db22b901c3';
        let chart = null;

        async function checkOtaUpdate() {
    const el = document.getElementById('ctrl-status');
    el.className = 'control-status';
    el.textContent = '⏳ 检查更新中...';
    document.querySelectorAll('.btn').forEach(b => b.disabled = true);
    try {
        // 先查版本, 看是否有新版
        const verR = await fetch(`/api/firmware/version`, { cache: 'no-store' });
        if (!verR.ok) throw new Error('HTTP ' + verR.status);
        const latestVer = (await verR.text()).trim();
        const curVer = await getFwVersion();
        el.textContent = `当前 ${curVer} / 云端 ${latestVer}`;
        if (latestVer === curVer) {
            el.className = 'control-status ok';
            el.textContent = `✅ 已是最新 (${curVer})`;
            return;
        }
        // 有新版, 派命令给 ESP32
        el.textContent = `🔄 有新版 ${latestVer}, 派发给 ESP32...`;
        const r = await fetch('/api/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: API_KEY, cmd: 'OTA_UPDATE', device_id: 'esp32_jh_01' })
        });
        const data = await r.json();
        if (!r.ok || !data.ok) throw new Error(data.error || 'HTTP ' + r.status);
        el.className = 'control-status ok';
        el.textContent = `✅ OTA 命令已入队 (#${data.id}) — ESP32 下次上报时检查并升级, 期间会重启`;
    } catch (err) {
        el.className = 'control-status err';
        el.textContent = `❌ 失败: ${err.message}`;
    } finally {
        document.querySelectorAll('.btn').forEach(b => b.disabled = false);
    }
}

async function getFwVersion() {
    // 简单解析 main 启动日志拿不到, 客户端硬编码 — 不准但够用
    // 实际应该 ESP32 push readings 时把 version 也带上, 但目前没带
    return '1.0.0';  // TODO: 从 ESP32 上报里读, 现在假设是 1.0.0
}

async function sendCmd(cmd, payload) {
            const el = document.getElementById('ctrl-status');
            el.className = 'control-status';
            el.textContent = `⏳ 发送 ${cmd}...`;
            document.querySelectorAll('.btn').forEach(b => b.disabled = true);
            try {
                const r = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: API_KEY, cmd, payload })
                });
                const data = await r.json();
                if (!r.ok || !data.ok) throw new Error(data.error || 'HTTP ' + r.status);
                el.className = 'control-status ok';
                el.textContent = `✅ 命令已入队 (#${data.id}, ${cmd}) — ESP32 下次上报时执行`;
            } catch (err) {
                el.className = 'control-status err';
                el.textContent = `❌ 失败: ${err.message}`;
            } finally {
                document.querySelectorAll('.btn').forEach(b => b.disabled = false);
            }
        }

        /* ===== 阈值配置 ===== */
        const onSlider  = document.getElementById('on-slider');
        const offSlider = document.getElementById('off-slider');
        const onVal     = document.getElementById('on-val');
        const offVal    = document.getElementById('off-val');
        const periodSel = document.getElementById('period-select');

        function syncSliderDisplays() {
            onVal.textContent  = onSlider.value;
            offVal.textContent = offSlider.value;
        }
        onSlider.addEventListener('input', syncSliderDisplays);
        offSlider.addEventListener('input', syncSliderDisplays);

        async function loadConfig() {
            try {
                const r = await fetch(`/api/config?device_id=esp32_jh_01&key=${encodeURIComponent(API_KEY)}`, { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const data = await r.json();
                if (!data.ok) throw new Error(data.error || 'unknown');
                const c = data.config;
                onSlider.value  = c.on_pct;
                offSlider.value = c.off_pct;
                periodSel.value = String(c.push_period_ms);
                syncSliderDisplays();
            } catch (err) {
                console.warn('loadConfig 失败:', err.message);
            }
        }

        async function saveConfig() {
            const el = document.getElementById('config-status');
            el.className = 'control-status';
            el.textContent = '⏳ 保存中...';
            document.querySelectorAll('.btn').forEach(b => b.disabled = true);
            const body = {
                key: API_KEY,
                device_id: 'esp32_jh_01',
                on_pct: parseInt(onSlider.value),
                off_pct: parseInt(offSlider.value),
                push_period_ms: parseInt(periodSel.value),
            };
            try {
                const r = await fetch('/api/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await r.json();
                if (!r.ok || !data.ok) throw new Error(data.error || 'HTTP ' + r.status);
                el.className = 'control-status ok';
                const min = Math.round(data.config.push_period_ms / 60000);
                const sec = Math.round(data.config.push_period_ms / 1000);
                const periodStr = min >= 1 ? `${min} 分钟` : `${sec} 秒`;
                el.textContent = `✅ 已保存: on<${data.config.on_pct}% off>=${data.config.off_pct}% period=${periodStr}`;
            } catch (err) {
                el.className = 'control-status err';
                el.textContent = `❌ 失败: ${err.message}`;
            } finally {
                document.querySelectorAll('.btn').forEach(b => b.disabled = false);
            }
        }

        loadConfig();
        setInterval(loadConfig, 60000);  /* 每分钟刷新一下, 看 ESP32 是否已拉走新值 */

        async function fetchData() {
            try {
                const r = await fetch('/api/data', { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return await r.json();
            } catch (err) {
                document.getElementById('content').innerHTML =
                    `<div class="card sensor-err">
                        <div class="label">⚠️ 后端无响应</div>
                        <div class="value" style="font-size:16px;">${err.message}</div>
                    </div>`;
                return null;
            }
        }

        function renderStatus(latest) {
            if (!latest) {
                return `<div class="card"><div class="empty-state">
                    <p>📡 暂无数据</p>
                    <p style="margin-top:8px;font-size:13px;">ESP32 还没上报过数据</p>
                </div></div>`;
            }
            const isErr = Number(latest.sensor_err) === 1;
            const pumpClass = isErr ? 'pump-lock' :
                              latest.pump_state === 'ON' ? 'pump-on' : 'pump-off';
            const pumpCN = PUMP_LABEL[latest.pump_state] || latest.pump_state;

            return `<div class="status-grid">
                <div class="card${isErr ? ' sensor-err' : ''}">
                    <div class="label">土壤湿度</div>
                    <div class="value">${latest.pct}%</div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width:${latest.pct}%"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="label">水泵状态</div>
                    <div class="value ${pumpClass}">${pumpCN}</div>
                </div>
                <div class="card">
                    <div class="label">设备</div>
                    <div class="value" style="font-size:18px;">${latest.device_id}</div>
                </div>
                <div class="card">
                    <div class="label">原始 ADC</div>
                    <div class="value">${latest.adc}</div>
                </div>
            </div>`;
        }

        function renderChart(history) {
            if (!history || history.length === 0) {
                return `<div class="chart-card"><h2>📈 最近 24 小时土壤湿度</h2>
                    <div class="empty-state">暂无历史数据</div></div>`;
            }
            const labels = history.map(h => {
                const d = new Date(h.ts);
                return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            });
            const pcts  = history.map(h => h.pct);
            const pumps = history.map(h => h.pump === 'ON' ? 1 : 0);

            return `<div class="chart-card">
                <h2>📈 最近 24 小时土壤湿度</h2>
                <div class="chart-container"><canvas id="chart"></canvas></div>
            </div>
            <script>
                const ctx = document.getElementById('chart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ${JSON.stringify(labels)},
                        datasets: [{
                            label: '湿度 %',
                            data: ${JSON.stringify(pcts)},
                            borderColor: 'rgb(67, 160, 71)',
                            backgroundColor: 'rgba(67, 160, 71, 0.15)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 2,
                            pointHoverRadius: 5,
                        }, {
                            label: '水泵 (1=ON)',
                            data: ${JSON.stringify(pumps)},
                            borderColor: 'rgb(25, 118, 210)',
                            borderDash: [4, 4],
                            tension: 0,
                            pointRadius: 0,
                            yAxisID: 'y1',
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: { legend: { position: 'bottom' } },
                        scales: {
                            x: { ticks: { maxTicksLimit: 12 } },
                            y:  { min: 0, max: 100, title: { display: true, text: '湿度 %' } },
                            y1: { min: 0, max: 1, display: false }
                        }
                    }
                });
            <\/script>`;
        }

        async function refresh() {
            const data = await fetchData();
            if (!data) return;

            const html = renderStatus(data.latest) + renderChart(data.history) +
                `<div class="chart-card" style="font-size:13px;opacity:0.8;">
                    <strong>📊 总览</strong> &nbsp;
                    总采样: <strong>${data.total_readings}</strong> 条 &nbsp;·&nbsp;
                    最近上报: <strong>${data.latest ? new Date(data.latest.ts).toLocaleString('zh-CN') : '无'}</strong>
                </div>`;

            document.getElementById('content').innerHTML = html;

            // 若上面注入的 <script> 还没执行, 等 DOM 解析后再 new Chart
            if (data.history && data.history.length > 0) {
                // 由于 innerHTML 注入的 script 标签会在解析时执行, 但 Chart.js 需要 canvas 已存在
                // 重新执行一次以确保 chart 创建
                setTimeout(() => {
                    const canvas = document.getElementById('chart');
                    if (canvas && !canvas.chart) {
                        const labels = data.history.map(h => {
                            const d = new Date(h.ts);
                            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                        });
                        const pcts  = data.history.map(h => h.pct);
                        const pumps = data.history.map(h => h.pump === 'ON' ? 1 : 0);
                        new Chart(canvas.getContext('2d'), {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: '湿度 %',
                                    data: pcts,
                                    borderColor: 'rgb(67, 160, 71)',
                                    backgroundColor: 'rgba(67, 160, 71, 0.15)',
                                    fill: true,
                                    tension: 0.3,
                                }, {
                                    label: '水泵 (1=ON)',
                                    data: pumps,
                                    borderColor: 'rgb(25, 118, 210)',
                                    borderDash: [4, 4],
                                    yAxisID: 'y1',
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                interaction: { mode: 'index', intersect: false },
                                plugins: { legend: { position: 'bottom' } },
                                scales: {
                                    y:  { min: 0, max: 100 },
                                    y1: { min: 0, max: 1, display: false }
                                }
                            }
                        });
                    }
                }, 100);
            }
        }

        refresh();
        setInterval(refresh, 30000);  // 每 30 秒刷新

        /* ===== 浇水历史 ===== */
        const TRIGGER_LABEL = { auto: '自动', web: '浏览器', manual: '手动' };
        const TRIGGER_ICON  = { auto: '🌱', web: '🖱️', manual: '👆' };

        async function fetchPumpHistory() {
            try {
                const r = await fetch(`/api/pump_events?device_id=esp32_jh_01&limit=30&key=${encodeURIComponent(API_KEY)}`, { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return await r.json();
            } catch (err) {
                document.getElementById('history-content').innerHTML =
                    `<div class="history-empty">⚠️ 加载失败: ${err.message}</div>`;
                return null;
            }
        }

        function fmtTs(iso) {
            const d = new Date(iso);
            const now = new Date();
            const sameDay = d.toDateString() === now.toDateString();
            const pad = n => String(n).padStart(2, '0');
            const time = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            if (sameDay) return time;
            return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${time}`;
        }

        function renderPumpHistory(data) {
            const container = document.getElementById('history-content');
            const countEl = document.getElementById('history-count');
            if (!data || !data.events || data.events.length === 0) {
                countEl.textContent = '';
                container.innerHTML = '<div class="history-empty">📭 暂无浇水记录</div>';
                return;
            }
            countEl.textContent = `(共 ${data.events.length} 条)`;
            const rows = data.events.map(e => {
                const trigLabel = `${TRIGGER_ICON[e.trigger] || '❓'} ${TRIGGER_LABEL[e.trigger] || e.trigger}`;
                const trigClass = `trigger-${e.trigger}`;
                let duration, endPct;
                if (e.running) {
                    duration = '<span class="running">运行中…</span>';
                    endPct = '—';
                } else {
                    duration = e.duration_sec != null ? `${e.duration_sec} 秒` : '—';
                    endPct = e.end_pct != null ? `${e.end_pct}%` : '—';
                }
                return `<tr>
                    <td>${fmtTs(e.start_ts)}</td>
                    <td class="${trigClass}">${trigLabel}</td>
                    <td>${duration}</td>
                    <td>${e.start_pct != null ? e.start_pct + '%' : '—'}</td>
                    <td>${endPct}</td>
                </tr>`;
            }).join('');
            container.innerHTML = `<table class="history-table">
                <thead><tr><th>时间</th><th>触发</th><th>时长</th><th>浇前%</th><th>浇后%</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
        }

        async function refreshHistory() {
            const data = await fetchPumpHistory();
            if (data) renderPumpHistory(data);
        }

        refreshHistory();
        setInterval(refreshHistory, 30000);  // 每 30s 拉一次新事件
    </script>
</body>
</html>
